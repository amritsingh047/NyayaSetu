version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lexai-postgres
    environment:
      POSTGRES_USER: lexai
      POSTGRES_PASSWORD: lexai_dev
      POSTGRES_DB: lexai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lexai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: lexai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-llm  # Only started with: docker compose --profile local-llm up

volumes:
  postgres_data:
  redis_data:
  ollama_data:
